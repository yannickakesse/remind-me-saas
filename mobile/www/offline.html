<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Remind Me</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0F17; color: #E6E8EE; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; gap: 16px; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 8px 0 0; }
    p { font-size: 15px; line-height: 1.5; color: #A9AFBC; max-width: 320px; margin: 0; }
    button { margin-top: 8px; background: #F39C12; color: #0B0F17; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <!--
    Page de secours de l'application mobile. Capacitor l'affiche quand le site
    https://tryremind-me.vercel.app ne peut pas être chargé :
    - soit le téléphone n'a pas Internet ;
    - soit le site répond par une erreur (maintenance, hébergement en pause…).
    On distingue les deux cas pour ne pas accuser la connexion à tort.
  -->
  <main>
    <img src="icon.png" alt="" />
    <h1 id="t"></h1>
    <p id="d"></p>
    <button id="b" type="button"></button>
  </main>
  <script>
    var SITE = "https://tryremind-me.vercel.app/login";
    var fr = /^fr/i.test(navigator.language || "fr");
    var TXT = {
      offline: fr
        ? ["Pas de connexion Internet", "Remind Me a besoin d'Internet pour afficher vos activités. Vérifiez votre connexion puis réessayez."]
        : ["No Internet connection", "Remind Me needs the Internet to show your activities. Check your connection and try again."],
      down: fr
        ? ["Remind Me est momentanément indisponible", "Votre connexion fonctionne : c'est notre service qui ne répond pas pour le moment. Vos données sont en sécurité. Réessayez dans quelques minutes."]
        : ["Remind Me is temporarily unavailable", "Your connection works: our service isn't responding right now. Your data is safe. Please try again in a few minutes."],
      retry: fr ? "Réessayer" : "Try again"
    };
    if (!fr) document.documentElement.lang = "en";
    function show(kind) {
      document.getElementById("t").textContent = TXT[kind][0];
      document.getElementById("d").textContent = TXT[kind][1];
    }
    document.getElementById("b").textContent = TXT.retry;
    show(navigator.onLine === false ? "offline" : "down");
    document.getElementById("b").addEventListener("click", function () {
      if (navigator.onLine === false) { show("offline"); return; }
      location.replace(SITE);
    });
    window.addEventListener("offline", function () { show("offline"); });
    window.addEventListener("online", function () { show("down"); });
  </script>
</body>
</html>
