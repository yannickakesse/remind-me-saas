name: Remind Me 24/7 Background Reminders Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Remind Me Cron Endpoint
        run: |
          # Secret obligatoire : GitHub → Settings → Secrets and variables → Actions → CRON_SECRET
          curl -sf -X POST "https://remind-me-saas-ybkc.vercel.app/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
